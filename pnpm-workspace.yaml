packages:
  - packages/*
savePrefix: ''
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@earendil-works/pi-coding-agent'
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-agent-core'
  - '@earendil-works/pi-tui'
allowBuilds:
  esbuild: true
  electron: true
  protobufjs: false
  '@google/genai': false
  electron-winstaller: false
supportedArchitectures:
  os:
    - darwin
    - current
  cpu:
    - x64
    - arm64
    - current
overrides:
  yauzl: 3.3.2
  undici: 8.5.0
  esbuild: 0.28.1
  dompurify: 3.4.12
  xcode>uuid: 11.1.1
  tar: '>=7.5.21'
  js-yaml: '>=4.3.0'
  fast-uri: '>=3.1.4'
  protobufjs: '>=7.6.5'
  '@hono/node-server': '>=2.0.5'
  'brace-expansion@1': 1.1.16
  'brace-expansion@2': 2.1.2
  'brace-expansion@5': 5.0.8
auditConfig:
  # Overridden to the patched 5.0.8 above; pnpm audit does not honor overrides,
  # so it keeps flagging the transitive electron-builder path as a false positive.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
patchedDependencies:
  '@ff-labs/fff-node@0.10.1': patches/@ff-labs__fff-node@0.10.1.patch
  '@earendil-works/pi-ai@0.80.6': patches/@earendil-works__pi-ai@0.80.6.patch
  '@earendil-works/pi-coding-agent@0.80.6': patches/@earendil-works__pi-coding-agent@0.80.6.patch
